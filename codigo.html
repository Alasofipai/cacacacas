<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL HILADO */
        .main-wrapper {
            display: flex;
            width: 100%;
            max-width: 1140px;
            margin: 0 auto;
            padding: 20px;
            align-items: center;
            position: relative;
        }

        /* --- SECCIÓN IZQUIERDA: BANNER DE FONDO --- */
        .banner-side {
            flex: 1.1;
            height: 520px;
            background: linear-gradient(135deg, #02111d 0%, #071f38 50%, #0d2f54 100%);
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        /* --- SECCIÓN DERECHA: SELECCIÓN DE PERFIL --- */
        .profile-side {
            flex: 0.9;
            padding: 0 10px 0 60px;
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }

        .logo-main {
            font-size: 2.6rem;
            font-weight: 700;
            color: #0d4b94;
            line-height: 1;
            letter-spacing: -1px;
        }
        .logo-sub {
            font-size: 0.65rem;
            color: #0d4b94;
            font-weight: 700;
            letter-spacing: 3px;
            margin-top: 2px;
        }

        .profile-side h2 {
            font-size: 1.1rem;
            color: #4a4a4a;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .profile-section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #333;
            margin: 15px 0 8px 0;
        }

        .profile-card {
            width: 100%;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            color: #4a4a4a;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .profile-card i {
            display: block;
            color: #0d4b94;
            font-size: 1.2rem;
            margin-bottom: 6px;
        }

        /* --- CAPA SUPERPUESTA OSCURA (OVERLAY) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 15px; /* Evita que el modal toque los bordes físicos del celular */
        }

        /* --- VENTANA MODAL 2FA --- */
        .modal-box {
            background-color: #ffffff;
            width: 500px;
            border-radius: 4px;
            padding: 35px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.1rem;
            color: #000000;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-label {
            font-size: 0.78rem;
            color: #9b9b9b;
            margin-bottom: 6px;
            display: block;
        }

        .select-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .select-wrapper select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #a0aab5;
            border-radius: 4px;
            font-size: 0.9rem;
            color: #333333;
            outline: none;
            background-color: #ffffff;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .select-wrapper::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 12px;
            top: 10px;
            color: #718096;
            pointer-events: none;
            font-size: 0.85rem;
        }

        .token-input-group {
            position: relative;
            border-bottom: 1px solid #9b9b9b;
            margin-bottom: 35px;
            padding-bottom: 5px;
        }

        .token-input-group input {
            width: 100%;
            border: none;
            text-align: center;
            outline: none;
            padding: 6px 0;
            font-size: 0.95rem;
            color: #333333;
            background: transparent;
        }

        .modal-actions {
            display: flex;
            gap: 25px;
        }

        .btn-cancel {
            flex: 1;
            background-color: #eef2f9;
            color: #0d4b94;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        .btn-submit {
            flex: 1;
            background-color: #5b8ecb;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* =========================================================

        ========================================================= */
        @media (max-width: 992px) {
            .main-wrapper { flex-direction: column; }
            .banner-side { display: none; }
            .profile-side { width: 100%; padding: 20px; }
        }

        /* Vista celular (Ajuste del tamaño del Token para pantallas pequeñas) */
        @media (max-width: 576px) {
            .modal-box {
                width: 100%;            /* Toma todo el ancho disponible del celular */

                border-radius: 8px;
            }

                top: 15px;

            }

                margin-bottom: 4px;
            }

            .select-wrapper {
                margin-bottom: 20px;    /* Menos separación entre bloques */
            }

            .select-wrapper select {
                padding: 6px 10px;      /* Reducción de la altura del selector */
                font-size: 0.85rem;
            }

            .select-wrapper::after {
                top: 8px;
                font-size: 0.75rem;
            }

            .token-input-group {
                margin-bottom: 25px;    /* Ajuste de margen inferior del input de texto */
                padding-bottom: 2px;
            }

            .token-input-group input {
                padding: 4px 0;
                font-size: 0.9rem;
            }

            .modal-actions {
                gap: 12px;              /* Botones más juntos y optimizados */
            }

            .btn-cancel, .btn-submit {
                padding: 10px;          /* Botones menos altos y más ajustados al dedo */
                font-size: 0.82rem;     /* Tamaño de fuente estilizado para smartphone */
                border-radius: 4px;
            }
        }
        /* Estilo para que el escrito parezca un enlace interactivo */
